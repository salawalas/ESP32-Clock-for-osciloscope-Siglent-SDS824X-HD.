; Uzycie w PlatformIO: skopiuj zawartosc main/ do src/ (CMakeLists.txt tez),
; reszta bez zmian. Wymagany ESP-IDF >= 5.2 (sprawdz wersje frameworka).

[platformio]
src_dir = main

[env:esp32dev]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_eol = LF
